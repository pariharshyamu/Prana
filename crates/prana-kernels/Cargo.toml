[package]
name = "prana-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIMD-friendly compute kernels for Prana (matmul, quant, norms, softmax)"

[dependencies]
prana-tensor.workspace = true

[lints.rust]
# The SIMD fast tier (simd_x86.rs) is the one place `unsafe` is allowed, and
# every unsafe op inside an unsafe fn must still be explicitly scoped.
unsafe_op_in_unsafe_fn = "deny"
